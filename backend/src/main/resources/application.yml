spring:
  application:
    name: barberos

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barberos}
    username: ${DB_USER:barberos}
    password: ${DB_PASS:devpassword}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid, profile, email
          github:
            client-id: ${OAUTH2_GITHUB_CLIENT_ID:placeholder}
            client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET:placeholder}
            scope: read:user, user:email

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:barberos-uploads}
    public-url: ${S3_PUBLIC_URL:http://localhost:9000/barberos-uploads}
  magic-link:
    token-expiry-minutes: ${MAGIC_LINK_EXPIRY:15}
    max-requests-per-hour: ${MAGIC_LINK_RATE_LIMIT:3}
    base-url: ${MAGIC_LINK_BASE_URL:http://localhost:3000}
